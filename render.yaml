services:
  - type: web
    name: svoyak
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: DATABASE_URL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: SESSION_SECRET
        generateValue: true